name: IPO Alert Bot

on:
  schedule:
    # 2:00 PM IST everyday (08:30 UTC)
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  alert:
    name: Run IPO Alert
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run IPO Alert Bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GMP_MIN_PCT: ${{ vars.GMP_MIN_PCT || 20 }}
        run: |
          python ipo_alert.py

      # Safety net: If Python fails or crashes, send a Telegram alert
      - name: Notify Telegram on Workflow Failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=🚨 <b>IPO Alert Workflow Failed</b>%0AWorkflow run failed on GitHub Actions.%0A<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Run Logs</a>"
          fi
