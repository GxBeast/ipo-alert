name: IPO alert
on:
  schedule:
    - cron: "30 3 * * 1-5"   # 9:00 AM IST: full report + closing-today list
    - cron: "30 9 * * 1-5"   # 3:00 PM IST: final apply/skip verdict
  workflow_dispatch:          # manual "Run workflow" button for testing
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dateutil playwright && playwright install --with-deps chromium
      - run: python ipo_alert.py ${{ github.event.schedule == '30 9 * * 1-5' && 'final' || 'morning' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
